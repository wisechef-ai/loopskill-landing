<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9b80ff"/>
      <stop offset="1" stop-color="#00e5c0"/>
    </linearGradient>
    <linearGradient id="wordgrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ecedf4"/>
      <stop offset="1" stop-color="#cfd0e6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9b80ff"/>
      <stop offset="1" stop-color="#00e5c0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.12" r="0.55">
      <stop stop-color="#7c5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.6">
      <stop stop-color="#00e5c0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00e5c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" rx="0" stroke="#232433" stroke-width="1"/>

  <!-- loop mark -->
  <g transform="translate(96,92)">
    <circle cx="34" cy="40" r="33" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="34" cy="6" r="8.5" fill="#00e5c0"/>
  </g>
  <text x="176" y="148" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="url(#wordgrad)" letter-spacing="-1">LoopSkill</text>

  <!-- headline -->
  <text x="96" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#ecedf4" letter-spacing="-2.5">The open registry of</text>
  <text x="96" y="378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="url(#accent)" letter-spacing="-2.5">runnable agent artifacts</text>

  <!-- subhead -->
  <text x="96" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#9a9bb0">Spotify for AI agents. Skills, bundles, loops &amp; personalities — over MCP.</text>

  <!-- artifact-type chips -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600">
    <rect x="96" y="486" width="118" height="46" rx="23" fill="#13131d" stroke="#232433"/>
    <text x="155" y="516" fill="#ecedf4" text-anchor="middle">Skills</text>
    <rect x="226" y="486" width="138" height="46" rx="23" fill="#13131d" stroke="#232433"/>
    <text x="295" y="516" fill="#ecedf4" text-anchor="middle">Bundles</text>
    <rect x="376" y="486" width="116" height="46" rx="23" fill="#13131d" stroke="#7c5cff"/>
    <text x="434" y="516" fill="#9b80ff" text-anchor="middle">Loops</text>
    <rect x="504" y="486" width="186" height="46" rx="23" fill="#13131d" stroke="#232433"/>
    <text x="597" y="516" fill="#ecedf4" text-anchor="middle">Personalities</text>
  </g>

  <!-- runner hook, bottom-right -->
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace">
    <text x="1104" y="498" font-size="22" font-weight="500" fill="#6c6d82" text-anchor="end">docker compose up  -&gt;  run a loop  -&gt;</text>
    <text x="1104" y="530" font-size="24" font-weight="700" fill="#00e5c0" text-anchor="end">{ "passed": true }</text>
  </g>

  <!-- open-core footer line -->
  <text x="96" y="582" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#6c6d82">Open-core · MPL-2.0 · self-host free · loopskill.io</text>
</svg>
